<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,Inter,'Helvetica Neue',Arial,sans-serif;}
  body{background:#cfcdc4;padding:30px;display:flex;gap:34px;align-items:flex-start;justify-content:center;}
  .col{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .lbl{font:700 14px Inter;color:#222;}
  .phone{width:300px;height:640px;border-radius:42px;overflow:hidden;position:relative;box-shadow:0 16px 50px rgba(0,0,0,.35);border:1px solid #888;}
  /* ── SÚČASNÝ ── */
  .cur{background:#1F8B3F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;height:100%;}
  .cur img{width:78px;height:78px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.3);}
  .spin{width:30px;height:30px;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* ── NOVÝ ── */
  .new{height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:linear-gradient(160deg,#0F5A28 0%,#1F8B3F 52%,#23A14B 100%);}
  .new::after{content:"⚽";position:absolute;right:-70px;bottom:-50px;font-size:340px;line-height:1;opacity:.07;pointer-events:none;}
  .new img{width:84px;height:84px;border-radius:20px;box-shadow:0 12px 32px rgba(0,0,0,.38);position:relative;}
  .new .tag{position:relative;color:rgba(255,255,255,.92);font-size:15px;font-weight:700;letter-spacing:4px;text-transform:uppercase;}
  .new .sub{position:relative;color:rgba(255,255,255,.62);font-size:12px;font-weight:500;margin-top:-10px;letter-spacing:.3px;}
  .new .spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;margin-top:6px;}
</style></head>
<body>
<div class="col">
  <div class="lbl">SÚČASNÝ</div>
  <div class="phone"><div class="cur">
    <img src="https://fairplaymanager.github.io/tatran-u11-trener/apple-touch-icon.png" alt="">
    <div class="spin"></div>
  </div></div>
</div>
<div class="col">
  <div class="lbl">NOVÝ (gradient + ⚽ watermark + tagline)</div>
  <div class="phone"><div class="new">
    <img src="https://fairplaymanager.github.io/tatran-u11-trener/apple-touch-icon.png" alt="">
    <div class="tag">Tatran U11</div>
    <div class="sub">Spravodlivé nominácie</div>
    <div class="spin"></div>
  </div></div>
</div>
</body></html>

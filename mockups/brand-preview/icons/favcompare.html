<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Sora,sans-serif}
  body{background:#15170f;color:#e9ece8;padding:26px}
  h1{font-size:18px;font-weight:800;margin-bottom:18px}
  table{border-collapse:collapse}
  td,th{padding:14px 22px;text-align:center;border:1px solid #2a3120}
  th{font-size:13px;color:#F7B53B;text-transform:uppercase;letter-spacing:.05em}
  .rh{font-size:12px;color:#9aa097;text-align:left;font-weight:600}
  .real{background:#fff;border-radius:6px;display:inline-block;padding:8px}
  .zoom{image-rendering:pixelated;background:#fff;border-radius:6px;border:1px solid #ccc}
  .lab{font-size:10px;color:#8a9088;margin-top:6px}
</style></head><body>
<h1>Favicon — PLNÝ vs MINI (skutočná veľkosť + 6× zoom)</h1>
<table>
  <tr><th></th><th>PLNÝ (tenký prstenec)</th><th>MINI (hrubší)</th></tr>
  <tr>
    <td class="rh">16 px<br>skutočná</td>
    <td><img class="real" src="favicon-full-16.png" width="16" height="16"></td>
    <td><img class="real" src="favicon-mini-16.png" width="16" height="16"></td>
  </tr>
  <tr>
    <td class="rh">16 px<br>6× zväčšené</td>
    <td><img class="zoom" src="favicon-full-16.png" width="96" height="96"><div class="lab">↑ prstenec sa zlieva</div></td>
    <td><img class="zoom" src="favicon-mini-16.png" width="96" height="96"><div class="lab">↑ čitateľnejšie</div></td>
  </tr>
  <tr>
    <td class="rh">32 px<br>skutočná</td>
    <td><img class="real" src="favicon-full-32.png" width="32" height="32"></td>
    <td><img class="real" src="favicon-mini-32.png" width="32" height="32"></td>
  </tr>
  <tr>
    <td class="rh">32 px<br>4× zväčšené</td>
    <td><img class="zoom" src="favicon-full-32.png" width="128" height="128"></td>
    <td><img class="zoom" src="favicon-mini-32.png" width="128" height="128"></td>
  </tr>
</table>
</body></html>
